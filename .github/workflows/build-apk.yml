name: Build Android TV APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Sync web assets to Android
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html style.css app.js animals.js gaze.js animal-art.js animals-extended.js animals-more.js habitats.js play-state.js keyboard-protection.js quiz-engine.js collection.js animal-facts.js sfx.js phonics.js keyboard-map.js memory-game.js manifest.webmanifest icon.svg android/app/src/main/assets/

      - name: Build Android APK
        working-directory: android
        run: |
          gradle assembleRelease --stacktrace

      - name: Prepare APK file
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk literkowo-tv.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: literkowo-tv-apk
          path: literkowo-tv.apk

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0-tv
          name: Literkowo TV v1.0.0 (Android TV APK)
          body: |
            ### Literkowo na Android TV (APK)
            
            Plik instalacyjny APK zoptymalizowany dla dekoderów i telewizorów z systemem **Android TV** z obsługą klawiatury fizycznej.
            
            #### Jak zainstalować:
            1. Pobierz plik `literkowo-tv.apk` poniżej.
            2. Przegraj plik na pendrive USB i podłącz do dekodera Android TV (lub prześlij bezprzewodowo za pomocą aplikacji *Send Files to TV*).
            3. Na dekoderze otwórz menedżer plików (np. *X-plore* lub *AnExplorer*) i zainstaluj plik APK.
            4. Aplikacja pojawi się na ekranie głównym Android TV (w kafelkach aplikacji).
          files: literkowo-tv.apk
