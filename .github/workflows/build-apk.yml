name: Build Android APK (Mobile & TV)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Sync web assets to Android
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html style.css app.js animals.js gaze.js animal-art.js animals-extended.js animals-more.js habitats.js play-state.js keyboard-protection.js quiz-engine.js collection.js animal-facts.js sfx.js phonics.js keyboard-map.js memory-game.js animal-sounds.js syllables.js animal-feed.js manifest.webmanifest icon.svg android/app/src/main/assets/

      - name: Build Android APKs
        working-directory: android
        run: |
          gradle assembleRelease --stacktrace

      - name: Prepare APK files
        run: |
          cp android/app/build/outputs/apk/mobile/release/app-mobile-release.apk literkowo.apk
          cp android/app/build/outputs/apk/mobile/release/app-mobile-release.apk literkowo-mobile.apk
          cp android/app/build/outputs/apk/tv/release/app-tv-release.apk literkowo-tv.apk

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: literkowo-apks
          path: |
            literkowo.apk
            literkowo-mobile.apk
            literkowo-tv.apk

      - name: Publish GitHub Release with APKs
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0
          name: Literkowo v1.0.0 (Android & Android TV)
          body: |
            ### Literkowo na Androida (Smartfony, Tablety i Android TV)
            
            Gotowe pliki instalacyjne APK (100% offline, brak mikropłatności, bezpieczne dla dzieci):
            
            1. 📱 **`literkowo.apk` / `literkowo-mobile.apk` (dla zwykłego Androida — smartfony i tablety)**:
               - Pełna obsługa dotykowa.
               - Wbudowana, kolorowa **klawiatura software'owa (ekranowa)** z dużymi polskimi literami (A–Z, Ą, Ć, Ę, Ł, Ń, Ó, Ś, Ź, Ż).
               - Klawisz karmienia zwierzaka 🥕, powtarzania dźwięku 🔊 oraz cofania ⌫.
               - Opcjonalne wsparcie dla systemowej klawiatury Androida (Gboard).
            
            2. 📺 **`literkowo-tv.apk` (dla Android TV — telewizory i dekodery)**:
               - Interfejs **10-foot UI** zoptymalizowany pod oglądanie z kanapy.
               - Sterowanie za pomocą **fizycznej klawiatury komputerowej** (USB/Bluetooth) lub pilota TV.
               - Zabezpieczenie przed przypadkowymi klawiszami systemowymi i bramka rodzicielska.
            
            #### Jak zainstalować na telefonie lub tablecie:
            1. Pobierz plik `literkowo.apk` bezpośrednio w przeglądarce telefonu/tabletu.
            2. Otwórz pobrany plik i potwierdź instalację.
            
            #### Jak zainstalować na Android TV:
            1. Pobierz plik `literkowo-tv.apk`.
            2. Skopiuj na pendrive USB i podłącz do telewizora/dekodera (lub prześlij bezprzewodowo za pomocą aplikacji *Send Files to TV*).
            3. Zainstaluj za pomocą menedżera plików (np. *X-plore* lub *AnExplorer*).
          files: |
            literkowo.apk
            literkowo-mobile.apk
            literkowo-tv.apk
